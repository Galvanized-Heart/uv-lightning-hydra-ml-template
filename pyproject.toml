[project]
name = "your-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.28.0",
    "lightning>=2.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "hydra-optuna-sweeper>=1.2",
    "hydra-colorlog>=1.2",
    "wandb",
    "optuna",
    "pandas",
    "pyarrow",
    "duckdb",
    "rootutils",
    "pre-commit",
    "rich",
    "pytest",
]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]